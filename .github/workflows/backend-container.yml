name: Validate backend container

on:
  pull_request:
    paths:
      - "backend/**"
      - "render.yaml"
      - ".github/workflows/backend-container.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ShopSwift backend image
        run: docker build --tag shopswift-backend:check ./backend
